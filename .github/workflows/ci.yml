name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Install integration test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clangd cmake build-essential
      - name: Verify integration test tools
        run: |
          clang++ --version
          clangd --version
          cmake --version
          ctest --version
      - run: npm test
      - run: npm pack --dry-run

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
